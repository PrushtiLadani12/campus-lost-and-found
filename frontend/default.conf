# Session 4 & 5: Ingress Load Balancer with Static IP Failover
upstream backend_cluster {
    server 172.20.0.10:8000 max_fails=1 fail_timeout=2s;
    server 172.20.0.20:8000 max_fails=1 fail_timeout=2s;
}

server {
    listen 80;
    server_name _;

    # Frontend Static UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Load-Balanced Backend REST API with Instant Failover
    location /api/ {
        proxy_pass http://backend_cluster/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Self-healing: Instantly failover to the active node
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
    }

    # Uploads Storage
    location /storage/ {
        proxy_pass http://backend_cluster/storage/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    }

    # Load-Balanced Health Check
    location /healthz {
        proxy_pass http://backend_cluster/healthz;
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
    }
}
