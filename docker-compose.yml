version: '3.8'

services:
  # Session 5: Replicated Backend Node 1 (Self-Healing Architecture)
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_lost_found_api_1
    environment:
      - INSTANCE_ID=backend-node-1
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///data/campus.db
      - UPLOAD_DIR=/app/storage
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    restart: always

  # Session 5: Replicated Backend Node 2 (High Availability & Failover)
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_lost_found_api_2
    environment:
      - INSTANCE_ID=backend-node-2
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///data/campus.db
      - UPLOAD_DIR=/app/storage
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    restart: always

  # Session 4: Ingress Gateway & Load Balancer (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus_lost_found_web
    ports:
      - "80:80"
    depends_on:
      - backend1
      - backend2
    restart: always

volumes:
  app_data:
  app_storage:
