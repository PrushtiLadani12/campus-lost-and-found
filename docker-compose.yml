version: '3.8'

services:
  # Session 5: Replicated Backend Node 1 (172.20.0.10)
  backend1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_lost_found_api_1
    environment:
      - INSTANCE_ID=backend-node-1
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///data/campus.db
      - UPLOAD_DIR=/app/storage
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    networks:
      campus_net:
        ipv4_address: 172.20.0.10
    restart: always

  # Session 5: Replicated Backend Node 2 (172.20.0.20)
  backend2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus_lost_found_api_2
    environment:
      - INSTANCE_ID=backend-node-2
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///data/campus.db
      - UPLOAD_DIR=/app/storage
    volumes:
      - app_data:/app/data
      - app_storage:/app/storage
    networks:
      campus_net:
        ipv4_address: 172.20.0.20
    restart: always

  # Session 4: Ingress Gateway & Load Balancer (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus_lost_found_web
    ports:
      - "80:80"
    depends_on:
      - backend1
      - backend2
    networks:
      campus_net:
        ipv4_address: 172.20.0.5
    restart: always

networks:
  campus_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  app_data:
  app_storage:
